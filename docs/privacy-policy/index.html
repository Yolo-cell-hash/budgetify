<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to budgetify.dev</title>
<!--
  This page has moved to budgetify.dev and only a redirect remains.

  GitHub Pages cannot issue a server-side 301, so this uses the three signals
  a static host has: a canonical tag so crawlers consolidate on the new URL, a
  zero-delay meta refresh that search engines treat as a redirect, and a
  location.replace() so a real visitor never gets a history entry pointing
  back here.

  Why it was retired rather than kept in sync: two copies of the same policy on
  two domains drift, and this one was reachable only over plain HTTP — the
  account's Pages custom domain (budgetify.me) has no TLS certificate. A
  privacy policy served without encryption is a poor look for an app whose
  entire argument is architectural privacy.
-->
<link rel="canonical" href="https://budgetify.dev/privacy-policy/">
<meta http-equiv="refresh" content="0; url=https://budgetify.dev/privacy-policy/">
<meta name="referrer" content="no-referrer">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#f6f6f3;color:#1b1e28;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:34rem;padding:2rem;text-align:center}
  h1{font-size:1.35rem;margin:0 0 .6rem}
  p{margin:.4rem 0;color:#565a6b}
  a{color:#7a5e28}
</style>
</head>
<body>
<main>
  <h1>Budgetify has moved</h1>
  <p>This site now lives at <a href="https://budgetify.dev/privacy-policy/">budgetify.dev</a>.</p>
  <p>If you are not redirected automatically, follow the link above to reach the Privacy Policy.</p>
</main>
<script>location.replace('https://budgetify.dev/privacy-policy/');</script>
</body>
</html>
