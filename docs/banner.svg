<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="380" viewBox="0 0 1200 380" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23273A"/>
      <stop offset="1" stop-color="#0C0E16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4C57E"/>
      <stop offset="1" stop-color="#A8843C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C8A75E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C8A75E" stop-opacity="0"/>
    </radialGradient>
    <!-- Launcher-style rounded tile, matching BrandLogo's 22% corner radius. -->
    <clipPath id="tile">
      <rect x="0" y="0" width="144" height="144" rx="32"/>
    </clipPath>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <circle cx="980" cy="90" r="260" fill="url(#glow)"/>
  <circle cx="180" cy="340" r="220" fill="#3A4163" opacity="0.18"/>

  <!-- Brand mark: the real Budgetify app icon (assets/branding/logo.png),
       embedded so it renders wherever this SVG is shown as an image. -->
  <g transform="translate(96,118)">
    <circle cx="72" cy="72" r="104" fill="url(#glow)"/>
    <image x="0" y="0" width="144" height="144" clip-path="url(#tile)" xlink:href="data:image/png;base64,"/>
    <rect x="0.75" y="0.75" width="142.5" height="142.5" rx="31.25" fill="none" stroke="url(#gold)" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>

  <!-- Wordmark -->
  <text x="280" y="170" fill="#FFFFFF" font-size="74" font-weight="700" letter-spacing="-2">Budgetify</text>
  <text x="284" y="214" fill="#C8A75E" font-size="21" font-weight="600" letter-spacing="6">YOUR MONEY, BEAUTIFULLY TRACKED</text>

  <!-- Feature pills (text centered within each pill so it never overflows) -->
  <g font-size="17" font-weight="600" fill="#E9E9E4" text-anchor="middle">
    <rect x="284" y="250" width="258" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.06" stroke="#C8A75E" stroke-opacity="0.30"/>
    <text x="413" y="278">100% Offline &amp; Private</text>

    <rect x="558" y="250" width="262" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.06" stroke="#C8A75E" stroke-opacity="0.30"/>
    <text x="689" y="278">Automatic SMS Tracking</text>

    <rect x="836" y="250" width="196" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.06" stroke="#C8A75E" stroke-opacity="0.30"/>
    <text x="934" y="278">No Ads · No Cloud</text>
  </g>
</svg>
